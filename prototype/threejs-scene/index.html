<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a0e">
  <meta name="description" content="雾港三维小样：一张低多边形地图场景，加人物与道具，可旋转、可点击。">
  <title>雾港 · 三维小样</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050a0e'/%3E%3Cpath d='M16 5l2.4 6.4L25 14l-6.6 2.6L16 23l-2.4-6.4L7 14l6.6-2.6z' fill='%23e3b978'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="scene" aria-label="雾港三维场景，可拖拽旋转、滚轮缩放、点击物件查看"></canvas>

  <div class="hud">
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="brand">
      <p class="eyebrow">拾词者 · 雾港 <span>/</span> SCENE SLICE 01</p>
      <h1>雾港 · 三维小样</h1>
      <p class="sub">地图场景 × 人物 × 道具<span class="sep">—</span>全程序化低多边形</p>
    </header>

    <div class="toolbar" role="group" aria-label="场景控制">
      <div class="seg" role="group" aria-label="时间">
        <button type="button" class="seg-btn is-on" data-mood="dusk" aria-pressed="true">黄昏</button>
        <button type="button" class="seg-btn" data-mood="night" aria-pressed="false">夜晚</button>
        <button type="button" class="seg-btn" data-mood="dawn" aria-pressed="false">黎明</button>
      </div>
      <button type="button" class="tool-btn" id="btn-rotate" aria-pressed="false" title="让镜头缓慢环绕">自动旋转</button>
      <button type="button" class="tool-btn" id="btn-reset" title="回到初始机位">重置视角</button>
      <button type="button" class="tool-btn tool-btn--list" id="btn-assets" aria-expanded="false" aria-controls="drawer">
        资产 <span id="asset-count" class="count">19</span>
      </button>
    </div>

    <aside class="drawer" id="drawer" aria-label="资产清单" hidden>
      <div class="drawer-head">
        <div>
          <p class="drawer-kicker">ASSET LIST</p>
          <h2>资产清单</h2>
        </div>
        <button type="button" class="icon-btn" id="btn-drawer-close" aria-label="关闭资产清单">×</button>
      </div>
      <p class="drawer-note">点条目，镜头会带你过去。</p>
      <div class="drawer-list" id="drawer-list"></div>
      <p class="drawer-foot" id="drawer-foot"></p>
    </aside>

    <section class="card" id="card" aria-live="polite" hidden>
      <button type="button" class="icon-btn card-close" id="btn-card-close" aria-label="关闭物件信息">×</button>
      <div class="card-top">
        <span class="badge" id="card-type">道具</span>
        <span class="card-tris" id="card-tris"></span>
      </div>
      <h2 id="card-name"></h2>
      <p class="card-en" id="card-en"></p>
      <p class="card-desc" id="card-desc"></p>
      <button type="button" class="focus-btn" id="btn-focus">镜头对准</button>
    </section>

    <p class="hint" id="hint">拖拽旋转<span>·</span>滚轮缩放<span>·</span>点击任意物件查看模型</p>
  </div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <p class="eyebrow">MIST HARBOR</p>
      <h2>正在点亮雾港</h2>
      <div class="loader-bar"><i></i></div>
      <p class="loader-note">低多边形 · 程序化建模</p>
    </div>
  </div>

  <div class="fallback" id="fallback" hidden>
    <h2>这台设备暂时点不亮雾港</h2>
    <p>需要浏览器支持 WebGL 2。试试最新版 Chrome / Edge / Safari，并确认没有关闭硬件加速。</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="./scene.js"></script>
</body>
</html>

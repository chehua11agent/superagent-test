<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b09" />
<meta name="description" content="《拾词者》第一章俯视角战棋小原型：一场以枯木庭院为舞台的回合制战斗。" />
<title>枯木庭院 · 俯视角战棋原型</title>
<style>
:root{
  --bg:#070b09;
  --bg-deep:#040705;
  --panel:#0d1410;
  --panel-2:#111a14;
  --line:rgba(196,208,178,.14);
  --line-strong:rgba(217,179,108,.3);
  --text:#e9e3d2;
  --muted:#98a28f;
  --dim:#6d7667;
  --moss:#86b078;
  --teal:#69c3b0;
  --ember:#e08954;
  --blood:#cf6d5d;
  --violet:#b397df;
  --gold:#d9b36c;
  --gold-soft:rgba(217,179,108,.14);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);background:var(--bg);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 48% 38%,rgba(48,74,55,.26),transparent 62%),
    radial-gradient(ellipse at 12% 94%,rgba(88,60,104,.12),transparent 55%),
    radial-gradient(ellipse at 92% 8%,rgba(30,60,52,.18),transparent 50%),
    linear-gradient(180deg,#070b09,#040705);
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.app{
  height:100dvh;max-width:1240px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}
/* ---------- HUD ---------- */
.hud{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:8px 12px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(17,26,20,.92),rgba(9,14,11,.92));
  box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.035);
  min-height:58px;
}
.brand{min-width:0;line-height:1.1}
.eyebrow{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--moss);margin-bottom:3px}
.brand h1{
  margin:0;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.09em;
  color:#efe7d3;text-shadow:0 2px 12px rgba(0,0,0,.55);white-space:nowrap;
}
.objectives{display:flex;gap:7px;flex-wrap:wrap;margin-left:4px}
.obj{
  display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.018);font-size:11px;white-space:nowrap;
}
.obj .dot{width:6px;height:6px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px rgba(207,109,93,.7)}
.obj[data-obj="tree"] .dot{background:var(--violet);box-shadow:0 0 8px rgba(179,151,223,.7)}
.obj[data-obj="rescue"] .dot{background:var(--gold);box-shadow:0 0 8px rgba(217,179,108,.6)}
.obj .name{color:var(--muted);letter-spacing:.03em}
.obj .val{color:var(--text);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:10px}
.obj.dead{opacity:.42}
.obj.dead .dot{background:var(--dim);box-shadow:none}
.obj.dead .val{text-decoration:line-through}
.round-box{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
.round-text{text-align:right;line-height:1.15;margin-right:3px}
.round-text span{display:block;font-size:9px;letter-spacing:.16em;color:var(--moss);text-transform:uppercase}
.round-text b{display:block;font-size:12px;font-weight:600;color:var(--text);letter-spacing:.03em}
.round-text.enemy span{color:var(--blood)}
.round-text.enemy b{color:#e7b3a8}
.icon-btn{
  min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.025);color:var(--muted);font-size:11px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;letter-spacing:.04em;
  transition:border-color .18s,color .18s,background .18s;
}
.icon-btn:hover{border-color:var(--line-strong);color:var(--text);background:rgba(217,179,108,.07)}
/* ---------- stage ---------- */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.board-shell{
  position:relative;flex:0 0 auto;overflow:hidden;border-radius:16px;
  border:1px solid rgba(217,179,108,.16);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03);
  background:#070b08;
}
#board{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.hint{
  flex:0 0 auto;min-height:17px;max-width:min(100%,860px);padding:0 6px;
  font-size:11px;line-height:1.5;color:var(--muted);text-align:center;letter-spacing:.02em;
  transition:color .2s;
}
.hint.warn{color:#e0a57e}
.hint.good{color:#a9d6a3}
/* ---------- banner ---------- */
.banner{
  position:absolute;left:50%;top:15%;width:94%;transform:translate(-50%,-8px);
  text-align:center;pointer-events:none;opacity:0;transition:opacity .28s ease,transform .28s ease;
  z-index:5;
}
.banner.show{opacity:1;transform:translate(-50%,0)}
.banner-main{
  font-family:var(--serif);font-size:clamp(22px,3.4vw,34px);font-weight:600;letter-spacing:.12em;
  color:#f2e9d3;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.75);
}
.banner-sub{margin-top:4px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 4px #000}
/* ---------- inspect ---------- */
.inspect{
  position:absolute;top:10px;right:10px;width:min(210px,52%);z-index:4;pointer-events:none;
  padding:8px 10px;border:1px solid rgba(217,179,108,.24);border-radius:10px;
  background:rgba(7,11,9,.88);backdrop-filter:blur(6px);
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.inspect .ins-name{font-size:12px;font-weight:600;letter-spacing:.04em}
.inspect .ins-line{margin-top:3px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.inspect .ins-trait{margin-top:5px;font-size:10px;line-height:1.45;color:#bfb39a}
/* ---------- mobile foe strip ---------- */
.mobile-info{display:none}
@media (max-width:760px){
  .mobile-info{
    display:block;flex:0 0 auto;padding:7px 9px;border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(180deg,rgba(15,23,18,.9),rgba(8,13,10,.92));
  }
  .mi-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
  .mi-head b{font-weight:600;color:var(--text);letter-spacing:.02em;font-size:10px}
  .mi-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .mi-chip{
    display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid rgba(207,109,93,.25);
    border-radius:6px;background:rgba(207,109,93,.05);font-size:9.5px;line-height:1.4;
  }
  .mi-chip b{font-weight:500;color:#d9b8ad;white-space:nowrap}
  .mi-chip i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .mi-chip.tree{border-color:rgba(179,151,223,.28);background:rgba(179,151,223,.06)}
  .mi-chip.tree b{color:#cdbce9}
  .mi-chip.druid{border-color:rgba(217,179,108,.28);background:rgba(217,179,108,.05)}
  .mi-chip.druid b{color:#e0c48f}
  .mi-chip.dead{opacity:.32;text-decoration:line-through}
}
/* ---------- dock ---------- */
.dock{
  flex:0 0 auto;display:flex;flex-direction:column;gap:7px;
  padding:8px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(16,25,19,.94),rgba(8,13,10,.96));
  box-shadow:0 14px 36px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.03);
}
.party{display:flex;gap:6px}
.hero-btn{
  flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 8px;
  border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.018);
  cursor:pointer;text-align:left;transition:border-color .18s,background .18s,opacity .18s;
  min-height:42px;
}
.hero-btn:hover{border-color:rgba(105,195,176,.35);background:rgba(105,195,176,.05)}
.hero-btn.active{border-color:rgba(105,195,176,.65);background:rgba(105,195,176,.1);box-shadow:inset 0 0 20px rgba(105,195,176,.06)}
.hero-btn.done{opacity:.5}
.hero-btn.dead{opacity:.32;filter:grayscale(.7)}
.hero-avatar{
  width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:13px;font-weight:700;color:#0a100c;
  background:linear-gradient(145deg,#9dcbb4,#4f8978);border:1px solid rgba(255,255,255,.25);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.hero-avatar.ranger{background:linear-gradient(145deg,#b6d59a,#628b57)}
.hero-avatar.wizard{background:linear-gradient(145deg,#cbb7ea,#7e6aab)}
.hero-avatar.cleric{background:linear-gradient(145deg,#e8d5a5,#a8864c)}
.hero-info{min-width:0;flex:1}
.hero-name{display:flex;justify-content:space-between;gap:4px;font-size:11px;letter-spacing:.03em;white-space:nowrap}
.hero-name em{font-style:normal;color:var(--dim);font-size:9px}
.hp-mini{height:4px;margin-top:3px;border-radius:2px;background:rgba(0,0,0,.6);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hp-mini i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#4f9a7b,#7fc79d);transition:width .3s}
.hero-btn.low .hp-mini i{background:linear-gradient(90deg,#a33f36,#d8785c)}
.hero-btn .check{font-size:10px;color:var(--teal);opacity:0}
.hero-btn.done .check{opacity:1}
.command{display:flex;gap:9px;align-items:stretch;min-height:64px}
.actor{
  flex:0 0 220px;width:220px;padding:2px 10px 2px 2px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;
}
.actor-top{display:flex;align-items:baseline;gap:7px;min-width:0}
.actor-name{font-family:var(--serif);font-size:16px;letter-spacing:.06em;white-space:nowrap}
.actor-role{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.actor-hp{display:flex;align-items:center;gap:6px}
.actor-hp .bar{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.actor-hp .bar i{display:block;height:100%;background:linear-gradient(90deg,#4f9a7b,#7fc79d);transition:width .3s}
.actor-hp .num{font-size:10px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.actor-tags{display:flex;gap:9px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden}
.actor-tags b{color:var(--text);font-weight:600}
.actor-tags .st{color:var(--violet)}
.abilities{flex:1 1 auto;display:flex;gap:7px;min-width:0}
.ability{
  position:relative;flex:1 1 0;min-width:0;padding:7px 10px 6px;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.018);
  cursor:pointer;transition:border-color .16s,background .16s,transform .12s,opacity .16s;
  min-height:58px;overflow:hidden;
}
.ability:hover:not(:disabled){border-color:rgba(217,179,108,.48);background:rgba(217,179,108,.06)}
.ability:active:not(:disabled){transform:translateY(1px)}
.ability:disabled{opacity:.36;cursor:not-allowed}
.ability.basic{border-color:rgba(217,179,108,.2)}
.ability .word{
  display:block;font-family:var(--serif);font-size:15px;line-height:1.15;letter-spacing:.03em;
  color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ability .zh{display:block;font-size:11px;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ability .meta{display:block;margin-top:3px;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ability .uses{
  position:absolute;top:5px;right:7px;font-family:var(--mono);font-size:9px;color:var(--muted);
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:0 3px;
}
.ability.empty{display:grid;place-items:center;color:var(--dim);font-size:11px;cursor:default;border-style:dashed}
.end-btn{
  flex:0 0 92px;min-width:92px;border:1px solid rgba(207,109,93,.32);border-radius:10px;
  background:linear-gradient(180deg,rgba(120,52,44,.32),rgba(70,30,26,.35));color:#e8c2b7;
  font-size:12px;letter-spacing:.08em;cursor:pointer;transition:border-color .18s,background .18s,opacity .18s;
}
.end-btn:hover:not(:disabled){border-color:rgba(207,109,93,.7);background:rgba(150,62,50,.42)}
.end-btn:disabled{opacity:.35;cursor:not-allowed}
/* ---------- overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(12,20,15,.55),rgba(4,7,5,.9) 70%),
    rgba(3,6,4,.55);
  backdrop-filter:blur(5px);
  opacity:0;transition:opacity .28s ease;
}
.overlay.show{opacity:1}
.panel{
  width:min(640px,100%);max-height:calc(100dvh - 36px);overflow:auto;
  padding:28px 30px 24px;border:1px solid rgba(217,179,108,.22);border-radius:20px;
  background:
    radial-gradient(ellipse at 80% -10%,rgba(105,195,176,.09),transparent 55%),
    linear-gradient(180deg,rgba(18,27,21,.985),rgba(7,11,9,.99));
  box-shadow:0 34px 90px rgba(0,0,0,.68),inset 0 1px rgba(255,255,255,.05);
  animation:panelIn .38s cubic-bezier(.2,.7,.2,1) both;
  scrollbar-width:thin;scrollbar-color:rgba(217,179,108,.3) transparent;
}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
.kicker{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.panel h2{
  margin:0 0 12px;font-family:var(--serif);font-weight:600;font-size:clamp(25px,4vw,34px);
  letter-spacing:.06em;color:#f0e7d2;line-height:1.2;
}
.panel p{margin:0 0 12px;font-size:13.5px;line-height:1.9;color:#c8c2b1}
.panel p.small{font-size:11.5px;color:var(--muted);line-height:1.7}
.panel strong{color:#e9dfc8;font-weight:600}
.panel .note{margin-top:16px;font-size:10.5px;line-height:1.7;color:var(--dim)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;align-items:center}
.btn{
  appearance:none;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.03);color:var(--text);font-size:13px;letter-spacing:.04em;cursor:pointer;
  transition:border-color .18s,background .18s,transform .12s;
}
.btn:hover{border-color:rgba(217,179,108,.45);background:rgba(217,179,108,.07)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  border-color:rgba(217,179,108,.75);
  background:linear-gradient(180deg,#e2c084,#b98f4b);
  color:#1a1409;font-weight:700;
  box-shadow:0 6px 18px rgba(190,145,75,.18);
}
.btn.primary:hover{background:linear-gradient(180deg,#ebcf98,#c69a53)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{border-color:rgba(207,109,93,.35);color:#e3b7ac}
/* cover */
.panel.cover{text-align:center;padding:40px 34px 30px;background:
  radial-gradient(ellipse at 50% -20%,rgba(105,195,176,.13),transparent 58%),
  radial-gradient(ellipse at 88% 100%,rgba(179,151,223,.09),transparent 50%),
  linear-gradient(180deg,rgba(15,23,18,.97),rgba(5,9,7,.99));}
.cover-rule{width:56px;height:1px;margin:0 auto 18px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.cover-title{
  margin:0 0 8px!important;font-family:var(--serif);font-weight:600!important;
  font-size:clamp(42px,8vw,68px)!important;letter-spacing:.14em!important;color:#f1e8d2!important;
  text-shadow:0 4px 30px rgba(0,0,0,.8),0 0 60px rgba(217,179,108,.12);
}
.cover-sub{font-size:11px!important;letter-spacing:.28em!important;text-transform:uppercase;color:var(--gold)!important;margin-bottom:22px!important}
.cover-lead{max-width:420px;margin:0 auto 22px!important;font-family:var(--serif);font-size:15px!important;line-height:2!important;color:#c4bda9!important}
.cover-stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:0 0 6px}
.cover-stats span{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.cover-stats b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:600;letter-spacing:.03em}
.cover .actions{justify-content:center}
.cover .note{max-width:430px;margin-left:auto;margin-right:auto}
/* objective box */
.objective-box{
  margin:16px 0 4px;padding:12px 14px;border:1px solid rgba(217,179,108,.2);border-radius:11px;
  background:linear-gradient(180deg,rgba(217,179,108,.055),rgba(217,179,108,.015));
}
.obj-line{display:flex;gap:12px;align-items:baseline;font-size:12px;line-height:1.75;padding:3px 0}
.obj-line span{flex:0 0 44px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.8}
.obj-line b{font-weight:500;color:#d9d2c0}
/* word chips */
.word-chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 2px}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;padding:4px 9px;border:1px solid var(--line);
  border-radius:999px;background:rgba(255,255,255,.02);font-size:10.5px;
}
.chip b{font-family:var(--serif);font-weight:600;font-size:12px;color:var(--gold);letter-spacing:.03em}
.chip span{color:var(--muted)}
/* victory stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 4px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.018)}
.stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:2px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* drawer */
.drawer{position:fixed;inset:0;z-index:45}
.drawer-backdrop{position:absolute;inset:0;background:rgba(3,6,4,.58);backdrop-filter:blur(3px)}
.drawer-panel{
  position:absolute;top:0;right:0;height:100%;width:min(440px,100%);
  display:flex;flex-direction:column;background:linear-gradient(180deg,#101811,#080d0a);
  border-left:1px solid rgba(217,179,108,.2);box-shadow:-24px 0 70px rgba(0,0,0,.5);
  animation:drawerIn .26s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes drawerIn{from{transform:translateX(18px);opacity:.5}to{transform:none;opacity:1}}
.drawer-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
}
.drawer-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em;color:#efe6d1}
.drawer-body{flex:1 1 auto;overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:rgba(217,179,108,.3) transparent}
.drawer-body h3{margin:18px 0 8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.drawer-body h3:first-child{margin-top:0}
.drawer-body p{font-size:12.5px;line-height:1.8;color:#c2bcaa;margin:0 0 10px}
.drawer-body p.small{font-size:11px;color:var(--muted)}
.word-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.word-row:last-child{border-bottom:none}
.word-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word-en{font-family:var(--serif);font-size:16px;color:var(--gold);letter-spacing:.03em}
.word-zh{font-size:12px;color:var(--text)}
.word-tag{margin-left:auto;font-size:9px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.word-row p{margin:5px 0 0;font-size:11.5px;line-height:1.65;color:var(--muted)}
.word-src{font-size:9px;letter-spacing:.08em;color:var(--moss);text-transform:uppercase;margin-left:2px}
.log-line{display:flex;gap:9px;padding:5px 0;font-size:11.5px;line-height:1.6;color:#c5bfae;border-bottom:1px solid rgba(255,255,255,.035)}
.log-line:last-child{border-bottom:none}
.log-line .r{flex:0 0 24px;font-family:var(--mono);font-size:9px;color:var(--dim);padding-top:2px}
.log-line.round{color:var(--gold);font-size:10px;letter-spacing:.12em;border-bottom:none;padding-top:12px}
.log-line.hit .r{color:var(--blood)}
.log-line.good .r{color:var(--moss)}
.log-empty{font-size:12px;color:var(--dim);padding:10px 0}
.help-block{margin-bottom:16px}
.help-block h3{margin-bottom:6px}
.help-block p:last-child{margin-bottom:0}
/* ---------- responsive ---------- */
@media (max-width:900px){
  .hud{flex-wrap:wrap;gap:8px 12px}
  .objectives{order:3;width:100%;margin-left:0;overflow-x:auto;padding-bottom:1px}
  .round-box{margin-left:auto}
  .actor{flex-basis:200px;width:200px}
}
@media (max-width:760px){
  .app{padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:6px}
  .hud{padding:7px 9px;border-radius:12px;min-height:0}
  .brand h1{font-size:18px}
  .eyebrow{font-size:8px}
  .obj{padding:4px 7px;font-size:10px}
  .obj .name{display:none}
  .round-text b{font-size:11px}
  .icon-btn{min-width:30px;height:30px;font-size:10px;padding:0 7px}
  .dock{padding:6px;gap:6px;border-radius:12px}
  .party{gap:4px}
  .hero-btn{padding:4px 5px;gap:5px;min-height:38px;border-radius:8px}
  .hero-avatar{width:23px;height:23px;flex-basis:23px;font-size:11px}
  .hero-name{font-size:10px}
  .hero-name em{display:none}
  .command{display:grid;grid-template-columns:1fr auto;grid-template-areas:"actor actor" "abilities end";gap:6px;min-height:0}
  .actor{grid-area:actor;width:auto;flex:none;border-right:none;padding:0 1px;flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
  .actor-name{font-size:14px}
  .actor-role{display:none}
  .actor-hp{flex:1;min-width:100px}
  .actor-tags{display:none}
  .abilities{grid-area:abilities;gap:5px;overflow-x:auto;scrollbar-width:none}
  .abilities::-webkit-scrollbar{display:none}
  .ability{flex:1 0 118px;min-height:52px;padding:6px 8px 5px}
  .ability .word{font-size:14px}
  .ability .meta{font-size:8.5px}
  .end-btn{grid-area:end;min-width:72px;flex-basis:72px;font-size:11px;padding:0 6px}
  .hint{font-size:10px;min-height:15px}
  .panel{padding:22px 18px 18px;border-radius:16px}
  .cover{padding:30px 20px 22px}
  .cover-title{font-size:clamp(38px,12vw,54px)!important}
  .cover-lead{font-size:14px!important}
  .cover-stats{gap:14px}
  .drawer-panel{
    top:auto;bottom:0;height:80dvh;width:100%;border-left:none;border-top:1px solid rgba(217,179,108,.2);
    border-radius:18px 18px 0 0;animation:sheetIn .26s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sheetIn{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:8px}
  .stat b{font-size:18px}
  .banner{top:12%}
}
@media (max-height:700px){
  .app{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom));gap:5px}
  .hud{min-height:0;padding:5px 9px}
  .brand h1{font-size:17px}
  .eyebrow{display:none}
  .party .hero-btn{min-height:34px;padding:3px 5px}

  .command{min-height:52px}
  .ability{min-height:48px}
  .dock{padding:5px;gap:5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

<body>
<div id="app" class="app">
  <header class="hud" id="hud">
    <div class="brand">
      <span class="eyebrow">拾词者 · 第一章原型</span>
      <h1>枯木庭院</h1>
    </div>
    <div class="objectives" id="objectives"></div>
    <div class="round-box">
      <div class="round-text" id="roundText"><span id="phaseLabel">准备中</span><b id="roundLabel">—</b></div>
      <button class="icon-btn" id="btnLog" aria-label="打开战报">战报</button>
      <button class="icon-btn" id="btnWords" aria-label="打开本章词卡">词卡</button>
      <button class="icon-btn" id="btnHelp" aria-label="打开原型说明">?</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="board-shell" id="boardShell">
      <canvas id="board" width="640" height="576" role="img" aria-label="枯木庭院战术地图：四名冒险者与流亡德鲁伊、树皮骑士、枯枝怪和古树的战斗"></canvas>
      <div id="banner" class="banner" aria-hidden="true"></div>
      <div id="inspect" class="inspect" hidden></div>
    </div>
    <div class="hint" id="hint" aria-live="polite">点击角色开始</div>
    <div id="mobileInfo" class="mobile-info" aria-label="敌情"></div>
  </main>

  <footer class="dock">
    <div class="party" id="partyStrip"></div>
    <div class="command">
      <div class="actor" id="actorCard"></div>
      <div class="abilities" id="abilityBar"></div>
      <button class="end-btn" id="btnEnd" type="button">结束回合</button>
    </div>
  </footer>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================

     ============================================================ */
  const W = 640, H = 576, T = 64, COLS = 10, ROWS = 9;
  const TAU = Math.PI * 2;

  // # wall, . stone, b briar, p pillar, f fungus
  const MAP = [
    '##########',

    '#....b...#',

  ];

  const CET4_OVERLAP = 1245;

  const WORD_CARDS = [
    { w:'strike', zh:'打击', group:'英雄技能', tag:'阿岚 · 普攻', src:'操作补充',

    { w:'bark', zh:'树皮；吠叫', group:'怪物技能', tag:'流亡德鲁伊 · 增益', src:'正文词',
      text:'德鲁伊给自己披上 bark，AC 变成 16，持续 3 回合。' },
    { w:'poison', zh:'毒', group:'怪物技能', tag:'流亡德鲁伊 · 法术', src:'正文词',
      text:'德鲁伊喷出 poison；体质豁免失败就受到 1d12 毒伤害。' },
    { w:'thorn', zh:'刺；荆棘', group:'场景与目标', tag:'古树 · 被动', src:'操作补充',
      text:'古树有 thorn 护体；近战攻击它的人会被扎 2 点。' },
    { w:'seed', zh:'种子', group:'场景与目标', tag:'古树 · 被动', src:'正文词',
      text:'古树会播下 seed，从根边唤出新的枯枝怪。' },
    { w:'fruit', zh:'果实', group:'场景与目标', tag:'剧情物品', src:'正文词',
      text:'古树的 fruit 是村民寻找了很多年的东西。' },
    { w:'rescue', zh:'援救', group:'场景与目标', tag:'章节目标', src:'正文词',
      text:'你们的任务是 rescue 被树缚住的冒险者。' },
    { w:'surrender', zh:'投降', group:'场景与目标', tag:'开场事件', src:'正文词',

    { w:'descend', zh:'下降', group:'场景与目标', tag:'开场叙述', src:'正文词',

    { w:'ancient', zh:'古老的', group:'场景与目标', tag:'开场叙述', src:'正文词',

    { w:'victory', zh:'胜利', group:'场景与目标', tag:'战斗结算', src:'操作补充',
      text:'victory 条件：古树与流亡德鲁伊都倒下。' },
    { w:'defeat', zh:'击败；挫败', group:'场景与目标', tag:'战斗结算', src:'正文词',
      text:'defeat 古树之后，被缚者才能重新呼吸。' },
  ];

  const ABILITY_DEFS = {
    strike: { id:'strike', word:'strike', zh:'打击', kind:'attack', target:'enemy', range:1, bonus:5, dice:[1,8], mod:3, dmg:'slashing', desc:'近战 1 格 · 1d8+3' },
    shield: { id:'shield', word:'shield', zh:'举盾', kind:'buff', effect:'shield', target:'ally', range:1, uses:2, desc:'目标 AC +5 · 持续到下一回合' },
    arrow: { id:'arrow', word:'arrow', zh:'射击', kind:'attack', target:'enemy', range:6, bonus:5, dice:[1,6], mod:3, dmg:'piercing', desc:'射程 6 格 · 1d6+3' },
    aim: { id:'aim', word:'aim', zh:'瞄准', kind:'attack', target:'enemy', range:6, bonus:7, dice:[1,6], mod:3, extraDice:[1,6], dmg:'piercing', uses:2, desc:'+2 命中 · 额外 1d6' },
    flame: { id:'flame', word:'flame', zh:'火焰箭', kind:'attack', target:'enemy', range:8, bonus:5, dice:[1,10], mod:0, dmg:'fire', desc:'射程 8 格 · 1d10 火焰' },
    magic: { id:'magic', word:'magic', zh:'魔法飞弹', kind:'auto', target:'enemy', range:8, darts:3, dice:[1,4], mod:1, uses:2, desc:'3 枚 · 每枚 1d4+1 · 必中' },

    staff: { id:'staff', word:'staff', zh:'杖击', kind:'attack', target:'enemy', range:1, bonus:4, dice:[1,8], mod:2, dmg:'bludgeoning', desc:'近战 · 1d8+2' },
    root: { id:'root', word:'root', zh:'根须缠绕', kind:'control', target:'enemy', range:6, save:'str', dc:13, status:'rooted', uses:2, desc:'力量豁免 DC 13 · 失败无法移动' },
    bark: { id:'bark', word:'bark', zh:'树皮术', kind:'buff', effect:'bark', target:'self', range:0, uses:1, desc:'AC 变为 16 · 持续 3 回合' },
    poison: { id:'poison', word:'poison', zh:'毒雾喷吐', kind:'save', target:'enemy', range:2, save:'con', dc:12, dice:[1,12], mod:0, dmg:'poison', desc:'体质豁免 DC 12 · 失败 1d12' },
    sword: { id:'sword', word:'sword', zh:'斩击', kind:'attack', target:'enemy', range:1, bonus:6, dice:[1,8], mod:4, dmg:'slashing', desc:'近战 · 1d8+4' },
    bite: { id:'bite', word:'bite', zh:'枝刺', kind:'attack', target:'enemy', range:1, bonus:3, dice:[1,4], mod:1, dmg:'piercing', desc:'近战 · 1d4+1' },
    frogbite: { id:'frogbite', word:'bite', zh:'咬击', kind:'attack', target:'enemy', range:1, bonus:3, dice:[1,6], mod:1, dmg:'piercing', desc:'近战 · 1d6+1' },
  };

  const HERO_DEFS = [
    {
      id:'fighter', name:'阿岚', role:'Fighter', kind:'fighter', hp:28, ac:18, speed:5,
      saves:{ str:3, dex:1, con:2, int:0, wis:1, cha:0 }, moves:'5 格',
      abilities:['strike','shield'], attackWord:'strike',
    },
    {
      id:'ranger', name:'米拉', role:'Ranger', kind:'ranger', hp:24, ac:15, speed:6,
      saves:{ str:1, dex:3, con:1, int:0, wis:2, cha:0 }, moves:'6 格',

    },
    {
      id:'wizard', name:'洛恩', role:'Wizard', kind:'wizard', hp:20, ac:12, speed:6,

    {

  const HERO_POS = [ [1,3], [1,4], [1,5], [2,4] ];

  /* ============================================================

  const $ = (sel) => document.querySelector(sel);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const die = (n, s) => { let t = 0; for (let i = 0; i < n; i++) t += 1 + Math.floor(Math.random() * s); return t; };
  const pct = (a, b) => b <= 0 ? 0 : clamp(a / b, 0, 1) * 100;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const compactQuery = window.matchMedia ? window.matchMedia('(max-width: 760px)') : null;
  let compactView = compactQuery ? compactQuery.matches : false;
  if (compactQuery) {
    const onCompact = (e) => { compactView = e.matches; };
    if (compactQuery.addEventListener) compactQuery.addEventListener('change', onCompact);
    else compactQuery.addListener(onCompact);
  }

  function hash2(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return (h ^ (h >>> 16)) >>> 0;
  }
  function seeded(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function roundRect(g, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  /* ============================================================

     ============================================================ */
  const tileAt = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? '#' : MAP[y][x];

  const isBriar = (x, y) => tileAt(x, y) === 'b';
  const isFloor = (x, y) => !isWall(x, y) && !isPillar(x, y);
  const blocksSight = (x, y) => isWall(x, y) || isPillar(x, y);
  const tileCenter = (x, y) => ({ x: (x + 0.5) * T, y: (y + 0.5) * T });

  /* ============================================================

     ============================================================ */
  let uid = 0;
  function makeAbility(id) {

  }
  function makeHero(def, idx) {

  }
  function createUnits() {
    uid = 0;
    const heroes = HERO_DEFS.map((d, i) => makeHero(d, i));
    const enemies = [
      makeEnemy({ id:'druid', name:'流亡德鲁伊', role:'Druid', kind:'druid', x:7, y:5, hp:27, ac:11, speed:5,

      makeEnemy({ id:'twig2', name:'枯枝怪', role:'Twig', kind:'twig', x:6, y:6, hp:4, ac:13, speed:4,
        saves:{ str:0, dex:2, con:1, int:0, wis:0, cha:0 }, abilities:['bite'], thrall:true, small:true, traits:['fireVuln'] }),
      makeEnemy({ id:'twig3', name:'枯枝怪', role:'Twig', kind:'twig', x:4, y:5, hp:4, ac:13, speed:4,
        saves:{ str:0, dex:2, con:1, int:0, wis:0, cha:0 }, abilities:['bite'], thrall:true, small:true, traits:['fireVuln'] }),
      makeEnemy({ id:'tree', name:'枯木古树', role:'The Tree', kind:'tree', x:7, y:3, size:2, hp:35, ac:10, speed:0,
        abilities:[], immobile:true, traits:['fireVuln','pierceResist','thorns'] }),
    ];
    return [...heroes, ...enemies];
  }

  /* ============================================================
     Game state
     ============================================================ */
  let state = null;
  let floorCanvas = null;
  let motes = [];
  let lastFrame = 0;
  let bannerTimer = 0;
  let inspectTimer = 0;

  function freshState() {
    return {
      phase: 'cover',
      round: 0,
      units: createUnits(),
      selectedId: null,
      mode: 'idle',
      pending: null,
      busy: false,
      hover: null,
      drawer: null,
      effects: [],
      log: [],
      ticker: null,
      stats: { damage: 0, kills: 0, fires: 0 },
      flags: { frog: false, treeDead: false, druidDead: false, lowTree: false, treeSpawns: 0 },
      lastHint: '',
      sheetReturn: null,
    };
  }

  const party = () => state.units.filter((u) => u.side === 'party');
  const enemies = () => state.units.filter((u) => (u.side === 'enemy' || u.side === 'wild') && !u.dead);
  const living = () => state.units.filter((u) => !u.dead);
  const byId = (id) => state.units.find((u) => u.id === id);
  const selected = () => state.selectedId ? byId(state.selectedId) : null;
  const druid = () => state.units.find((u) => u.id === 'druid');
  const tree = () => state.units.find((u) => u.id === 'tree');

  function tilesOf(u) {
    const out = [];
    for (let dy = 0; dy < (u.size || 1); dy++) {
      for (let dx = 0; dx < (u.size || 1); dx++) out.push([u.x + dx, u.y + dy]);
    }
    return out;
  }
  function occupies(u, x, y) {
    for (const [tx, ty] of tilesOf(u)) if (tx === x && ty === y) return true;
    return false;
  }
  function unitAt(x, y) {
    return living().find((u) => occupies(u, x, y)) || null;
  }
  function unitAtExcept(x, y, except) {
    return living().find((u) => u !== except && !u.dead && occupies(u, x, y)) || null;
  }
  function distanceUnits(a, b) {
    let best = Infinity;
    for (const [ax, ay] of tilesOf(a)) {
      for (const [bx, by] of tilesOf(b)) {
        best = Math.min(best, cheb(ax, ay, bx, by));
      }
    }
    return best;
  }
  function effectiveAc(u) {
    let ac = u.ac;
    if (u.kind === 'druid' && state.round <= u.barkUntil) ac = Math.max(ac, 16);
    if (u.kind === 'knight') ac = Math.max(ac, 16);
    if (u.shieldRound === state.round) ac += 5;
    return ac;
  }
  function isHostileTo(a, b) {
    if (!a || !b || a === b) return false;
    const aSide = a.side, bSide = b.side;
    if (aSide === 'party') return bSide === 'enemy' || bSide === 'wild';
    if (aSide === 'wild') return bSide === 'druid' || bSide === 'party';
    return bSide === 'party' || bSide === 'wild';
  }

  /* ============================================================
     Map rendering (static)
     ============================================================ */
  const floorTints = ['#1a231b', '#1c261d', '#18211a', '#1e281f', '#19221b'];

  function drawFloorTile(g, x, y) {
    const px = x * T, py = y * T;
    const r = seeded(hash2(x, y));
    const base = floorTints[Math.floor(r() * floorTints.length)];
    g.fillStyle = base;
    g.fillRect(px, py, T, T);

    // soft variation
    const v = g.createRadialGradient(px + T * r(), py + T * r(), 2, px + T / 2, py + T / 2, T * .75);
    v.addColorStop(0, 'rgba(120,150,115,.045)');
    v.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = v;
    g.fillRect(px, py, T, T);

    // slab joints
    g.strokeStyle = 'rgba(0,0,0,.24)';
    g.lineWidth = 1;
    g.strokeRect(px + .5, py + .5, T - 1, T - 1);
    g.strokeStyle = 'rgba(210,225,200,.035)';
    g.beginPath();
    g.moveTo(px + 1, py + T - 2);
    g.lineTo(px + T - 2, py + T - 2);
    g.stroke();

    // cracks
    if (r() < .52) {
      g.strokeStyle = 'rgba(0,0,0,.3)';
      g.lineWidth = 1;
      let cx = px + 8 + r() * (T - 16), cy = py + 8 + r() * (T - 16);
      g.beginPath();
      g.moveTo(cx, cy);
      const segs = 2 + Math.floor(r() * 3);
      for (let i = 0; i < segs; i++) {
        cx += (r() - .5) * 26;
        cy += (r() - .5) * 26;
        g.lineTo(cx, cy);
      }
      g.stroke();
    }

    // rubble
    for (let i = 0; i < 3; i++) {
      if (r() < .55) {
        g.fillStyle = 'rgba(200,215,185,.05)';
        g.beginPath();
        g.ellipse(px + 6 + r() * (T - 12), py + 6 + r() * (T - 12), 1 + r() * 2.5, .8 + r() * 1.6, r() * TAU, 0, TAU);
        g.fill();
      }
    }

    // moss
    if (r() < .34) {
      const mx = px + 8 + r() * (T - 16), my = py + 8 + r() * (T - 16);
      const mr = 9 + r() * 20;
      const mg = g.createRadialGradient(mx, my, 0, mx, my, mr);
      mg.addColorStop(0, 'rgba(96,126,64,.15)');
      mg.addColorStop(1, 'rgba(96,126,64,0)');
      g.fillStyle = mg;
      g.beginPath();
      g.arc(mx, my, mr, 0, TAU);
      g.fill();
    }
  }

  function drawWallTile(g, x, y) {
    const px = x * T, py = y * T;
    const r = seeded(hash2(x + 31, y + 17));
    g.fillStyle = '#040705';
    g.fillRect(px, py, T, T);
    for (let i = 0; i < 5; i++) {
      const bx = px + 4 + r() * (T - 8);
      const by = py + 6 + r() * (T - 10);
      const bw = 10 + r() * 24, bh = 8 + r() * 18;
      g.fillStyle = r() < .5 ? '#0a100b' : '#0d140e';
      g.beginPath();
      g.ellipse(bx, by, bw / 2, bh / 2, r() * TAU, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(130,155,125,.035)';
      g.beginPath();
      g.ellipse(bx - 1, by - 2, bw / 2.6, bh / 3.2, r() * TAU, 0, TAU);
      g.fill();
    }
  }

  function drawPillar(g, x, y) {
    const cx = (x + .5) * T, cy = (y + .5) * T;
    const r = seeded(hash2(x + 5, y + 9));
    g.save();
    g.fillStyle = 'rgba(0,0,0,.4)';
    g.beginPath();
    g.ellipse(cx + 5, cy + 12, 24, 9, 0, 0, TAU);
    g.fill();
    const grd = g.createRadialGradient(cx - 8, cy - 10, 3, cx, cy, 28);
    grd.addColorStop(0, '#3a4438');
    grd.addColorStop(.55, '#222b23');
    grd.addColorStop(1, '#0c110d');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(cx, cy, 25, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,.45)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.arc(cx, cy, 25, 0, TAU);
    g.stroke();
    g.strokeStyle = 'rgba(210,225,200,.09)';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(cx, cy, 18, Math.PI * 1.1, Math.PI * 1.7);
    g.stroke();
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = 'rgba(0,0,0,.35)';
      g.beginPath();
      let a = r() * TAU, rr = 5 + r() * 15;
      g.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      g.lineTo(cx + Math.cos(a + .7) * (rr + 8), cy + Math.sin(a + .7) * (rr + 8));
      g.stroke();
    }
    g.restore();
  }

  function drawBriar(g, x, y) {
    const px = x * T, py = y * T;
    const r = seeded(hash2(x + 11, y + 23));
    g.save();
    const patch = g.createRadialGradient(px + T / 2, py + T / 2, 3, px + T / 2, py + T / 2, T * .62);
    patch.addColorStop(0, 'rgba(26,42,25,.55)');
    patch.addColorStop(.7, 'rgba(20,33,20,.28)');
    patch.addColorStop(1, 'rgba(20,33,20,0)');
    g.fillStyle = patch;
    g.fillRect(px, py, T, T);
    g.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const sx = px + 6 + r() * (T - 12), sy = py + 6 + r() * (T - 12);
      const ex = sx + (r() - .5) * 46, ey = sy + (r() - .5) * 46;
      g.strokeStyle = r() < .5 ? 'rgba(52,72,40,.95)' : 'rgba(68,88,50,.88)';
      g.lineWidth = 1.1 + r() * 1.5;
      g.beginPath();
      g.moveTo(sx, sy);
      g.quadraticCurveTo(sx + (r() - .5) * 20, sy + (r() - .5) * 20, ex, ey);
      g.stroke();
      // thorn
      g.fillStyle = r() < .5 ? 'rgba(150,120,185,.7)' : 'rgba(100,130,80,.65)';
      const tx = ex - 2 + r() * 4, ty = ey - 2 + r() * 4;
      g.beginPath();
      g.moveTo(tx, ty);
      g.lineTo(tx + 3.5, ty - 5);
      g.lineTo(tx + 1, ty + 1.5);
      g.closePath();
      g.fill();
    }
    g.strokeStyle = 'rgba(130,110,180,.1)';
    g.lineWidth = 3;
    g.beginPath();
    g.arc(px + T / 2, py + T / 2, 22, 0, TAU);
    g.stroke();
    g.restore();
  }

  function drawFungus(g, x, y) {
    const cx = (x + .5) * T, cy = (y + .5) * T;
    const r = seeded(hash2(x + 3, y + 41));
    g.save();
    const glow = g.createRadialGradient(cx, cy, 0, cx, cy, 34);
    glow.addColorStop(0, 'rgba(120,210,195,.16)');
    glow.addColorStop(.55, 'rgba(120,210,195,.05)');
    glow.addColorStop(1, 'rgba(120,210,195,0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(cx, cy, 34, 0, TAU);
    g.fill();
    for (let i = 0; i < 7; i++) {
      const fx = cx + (r() - .5) * 40, fy = cy + (r() - .5) * 40;
      const rad = 1.2 + r() * 3.2;
      const col = r() < .6 ? '160,225,200' : '175,145,225';
      g.shadowColor = 'rgba(' + col + ',.8)';
      g.shadowBlur = 8;
      g.fillStyle = 'rgba(' + col + ',.75)';
      g.beginPath();
      g.arc(fx, fy, rad, 0, TAU);
      g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = 'rgba(' + col + ',.22)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(fx, fy + rad);
      g.lineTo(fx + (r() - .5) * 5, fy + rad + 6 + r() * 7);
      g.stroke();
    }
    g.restore();
  }

  function drawFloorRim(g) {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!isFloor(x, y)) continue;
        const px = x * T, py = y * T;
        if (isWall(x - 1, y)) {
          const gr = g.createLinearGradient(px, 0, px + 20, 0);
          gr.addColorStop(0, 'rgba(0,0,0,.55)');
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.fillRect(px, py, 20, T);
          for (let i = 0; i < 2; i++) {
            g.fillStyle = 'rgba(92,105,82,.12)';
            roundRect(g, px + 2, py + 6 + i * 28, 7, 16, 3);
            g.fill();
          }
        }
        if (isWall(x + 1, y)) {
          const gr = g.createLinearGradient(px + T, 0, px + T - 20, 0);
          gr.addColorStop(0, 'rgba(0,0,0,.5)');
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.fillRect(px + T - 20, py, 20, T);
        }
        if (isWall(x, y - 1)) {
          const gr = g.createLinearGradient(0, py, 0, py + 18);
          gr.addColorStop(0, 'rgba(0,0,0,.55)');
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.fillRect(px, py, T, 18);
          g.fillStyle = 'rgba(60,80,48,.12)';
          g.beginPath(); g.ellipse(px + T / 2, py + 6, T * .42, 7, 0, 0, TAU); g.fill();
        }
        if (isWall(x, y + 1)) {
          const gr = g.createLinearGradient(0, py + T, 0, py + T - 16);
          gr.addColorStop(0, 'rgba(0,0,0,.5)');
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.fillRect(px, py + T - 16, T, 16);
        }
      }
    }
    // a faint green pool near the entrance
    const lp = g.createRadialGradient(2 * T, 4.2 * T, 10, 2 * T, 4.2 * T, 170);
    lp.addColorStop(0, 'rgba(96,150,110,.055)');
    lp.addColorStop(1, 'rgba(96,150,110,0)');
    g.fillStyle = lp;
    g.fillRect(0, 0, W, H);
  }

  function buildFloor() {
    const c = document.createElement('canvas');
    c.width = W * 2;
    c.height = H * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    g.fillStyle = '#060906';
    g.fillRect(0, 0, W, H);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (isWall(x, y)) drawWallTile(g, x, y);
        else drawFloorTile(g, x, y);
      }
    }
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (isPillar(x, y)) drawPillar(g, x, y);
      }
    }
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (isBriar(x, y)) drawBriar(g, x, y);
      }
    }
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (tileAt(x, y) === 'f') drawFungus(g, x, y);
      }
    }
    drawFloorRim(g);
    return c;
  }

  /* ============================================================
     Toast / hint / log
     ============================================================ */
  const HINT_BASE = '点击角色 · 蓝色格移动 · 点击敌人普攻 · 技能按钮先选目标';
  function setTicker(text, ms = 4200) {
    state.ticker = { text, until: performance.now() + ms };
    updateHint();
    clearTimeout(setTicker._t);
    setTicker._t = setTimeout(() => {
      if (state.ticker && performance.now() >= state.ticker.until) {
        state.ticker = null;
        updateHint();
      }
    }, ms + 60);
  }
  function updateHint() {
    const el = $('#hint');
    if (!el || !state) return;
    let text = '';
    let tone = '';
    if (state.mode === 'target' && state.pending) {
      text = '选择目标：' + state.pending.zh + ' · 点空白处或 Esc 取消';
      tone = 'warn';
    } else if (state.phase === 'enemy') {
      text = '敌方行动中……';
      tone = 'warn';
    } else if (state.phase === 'player' && selected()) {
      const u = selected();
      if (u.rooted) text = u.name + ' 被根须缠住了，本回合不能移动；仍然可以行动';
      else if (u.moved && u.acted) text = u.name + ' 已完成行动';
      else if (u.acted) text = u.name + ' 还可以移动；点蓝色格，或结束回合';
      else if (u.moved) text = u.name + ' 已移动；选择一个技能，或点击敌人普攻';
      else text = u.name + '：点蓝色格移动，或点击敌人普攻 / 选择技能';
    } else if (state.phase === 'player') {
      text = state.busy ? '……' : HINT_BASE;
    } else if (state.phase === 'ending') {
      text = '战斗结束……';
      tone = 'good';
    } else if (state.phase === 'won') {
      text = '战斗结束 · 胜利';
      tone = 'good';
    } else if (state.phase === 'lost') {
      text = '战斗结束 · 失败';
      tone = 'warn';
    }
    if (state.ticker && performance.now() < state.ticker.until) {
      text = state.ticker.text;
      tone = '';
    }
    el.textContent = text;
    el.classList.toggle('warn', tone === 'warn');
    el.classList.toggle('good', tone === 'good');
  }
  function addLog(text, kind = 'info') {
    if (!state) return;
    state.log.push({ round: state.round || 0, text, kind });
    if (kind !== 'round') setTicker(text);
    if (state.drawer === 'log') renderDrawerBody();
  }

  /* ============================================================
     UI rendering
     ============================================================ */
  function renderUI() {
    if (!state) return;
    renderObjectives();
    renderParty();
    renderActor();
    renderAbilities();
    renderRound();
    renderMobileInfo();
    updateHint();
    const endBtn = $('#btnEnd');
    endBtn.disabled = !(state.phase === 'player' && !state.busy);
    endBtn.textContent = state.phase === 'enemy' ? '敌方行动' : '结束回合';
  }

  function renderObjectives() {
    const t = tree(), d = druid(), k = byId('knight');
    const parts = [];
    parts.push(`<div class="obj ${t && t.dead ? 'dead' : ''}" data-obj="tree">
      <span class="dot"></span><span class="name">古树</span>
      <span class="val">${t ? (t.dead ? '已倒下' : t.hp + '/' + t.maxHp) : '—'}</span></div>`);
    parts.push(`<div class="obj ${d && d.dead ? 'dead' : ''}" data-obj="druid">
      <span class="dot"></span><span class="name">德鲁伊</span>
      <span class="val">${d ? (d.dead ? '已击败' : d.hp + '/' + d.maxHp) : '—'}</span></div>`);
    const rescued = state.flags.treeDead;
    parts.push(`<div class="obj ${rescued ? 'done' : ''}" data-obj="rescue">
      <span class="dot"></span><span class="name">被缚者</span>
      <span class="val">${rescued ? '已解救' : (k ? '待解救' : '—')}</span></div>`);
    $('#objectives').innerHTML = parts.join('');
  }

  function renderParty() {
    const html = party().map((u) => {
      const cls = [
        'hero-btn',
        u.id === state.selectedId ? 'active' : '',
        u.done ? 'done' : '',
        u.dead ? 'dead' : '',
        u.hp / u.maxHp < .34 ? 'low' : '',
      ].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-hero="${u.id}" ${u.dead ? 'disabled' : ''} aria-label="${esc(u.name)}，生命 ${u.dead ? 0 : u.hp}/${u.maxHp}">
        <span class="hero-avatar ${u.kind}">${esc(u.name.slice(0, 1))}</span>
        <span class="hero-info">
          <span class="hero-name">${esc(u.name)}<em>${u.dead ? '倒下' : 'HP ' + u.hp}</em><span class="check">✓</span></span>
          <span class="hp-mini"><i style="width:${u.dead ? 0 : pct(u.hp, u.maxHp)}%"></i></span>
        </span>
      </button>`;
    }).join('');
    $('#partyStrip').innerHTML = html;
  }

  function renderActor() {
    const u = selected();
    if (!u || u.dead) {
      $('#actorCard').innerHTML = `<div class="actor-top"><span class="actor-name" style="color:var(--muted)">等待行动</span></div>
        <div class="actor-tags"><span>选择一名角色，查看技能与状态</span></div>`;
      return;
    }
    const status = [];
    if (u.rooted) status.push('<span class="st">缠绕</span>');
    if (u.shieldRound === state.round) status.push('<span class="st">AC +5</span>');
    if (u.id === 'druid' && state.round <= u.barkUntil) status.push('<span class="st">树皮 AC 16</span>');
    const statusHtml = status.length ? ' · ' + status.join(' ') : '';
    $('#actorCard').innerHTML = `
      <div class="actor-top"><span class="actor-name">${esc(u.name)}</span><span class="actor-role">${esc(u.role)}</span></div>
      <div class="actor-hp"><span class="bar"><i style="width:${pct(u.hp, u.maxHp)}%"></i></span><span class="num">${u.hp}/${u.maxHp}</span></div>
      <div class="actor-tags">
        <span>AC <b>${effectiveAc(u)}</b></span>
        <span>移动 <b>${u.speed}</b></span>
        <span>${u.moved ? '移动 ✓' : '移动 —'}</span>
        <span>${u.acted ? '行动 ✓' : '行动 —'}</span>
        ${statusHtml}
      </div>`;
  }

  function renderAbilities() {
    const bar = $('#abilityBar');
    const u = selected();
    if (!u || u.dead) {
      bar.innerHTML = `<div class="ability empty">选择角色</div>`;
      return;
    }
    const html = u.abilities.map((a) => {
      const remaining = a.uses === Infinity ? '∞' : a.uses;
      const disabled = u.dead || u.acted || a.uses <= 0 || state.phase !== 'player' || state.busy;
      const basic = a === u.abilities[0] ? ' basic' : '';
      const meta = a.kind === 'buff' ? a.desc : a.desc;
      return `<button type="button" class="ability${basic}" data-ability="${a.id}" ${disabled ? 'disabled' : ''} title="${esc(a.desc)}">
        <span class="uses">${remaining}</span>
        <span class="word">${esc(a.word)}</span>
        <span class="zh">${esc(a.zh)}</span>
        <span class="meta">${esc(meta)}</span>
      </button>`;
    }).join('');
    bar.innerHTML = html;

  function renderRound() {
